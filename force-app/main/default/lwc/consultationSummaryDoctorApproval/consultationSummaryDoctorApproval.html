<template>
    <template if:true={spinnerStatus}>
        <div class="slds-spinner_container slds-is-fixed">
            <lightning-spinner alternative-text="Loading" size="large" variant="brand"></lightning-spinner>
        </div>
    </template>
    <template if:true={isShowPopup}>
        <!-- <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
            aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container"> -->
        <!-- modal header start -->
        <!-- <header class="slds-modal__header"> -->
        <!-- <button class="slds-button slds-button_icon slds-modal__close" title="Close" onclick={hideModalBox}>
                        <lightning-icon icon-name="utility:close" alternative-text="close"
                            size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button> -->
        <div class="slds-modal__header">
            <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Consultation Summary /
                परामर्श विवरण</h2>
        </div>

        <!-- </header> -->

        <!-- modal body start -->
        <!-- <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1"> -->
        <div class="slds-box">
            <template if:true={isSending}>
                <div class="slds-spinner_container slds-is-fixed" style="z-index: 9000;">
                    <div role="status" class="slds-spinner slds-spinner_medium slds-spinner_brand">
                        <span class="slds-assistive-text">Loading</span>
                        <div class="slds-spinner__dot-a"></div>
                        <div class="slds-spinner__dot-b"></div>
                    </div>
                    <div style="font-weight: 700;color: black;font-size: 1.1rem;text-align: center;padding-top: 5rem;">
                        Sending email. Kindly wait...
                    </div>
                </div>
            </template>
            <template if:false={isSending}>
                <div class="prescription-header">
                    <div class="left-info">
                        <p><strong>{summary.doctorName}</strong></p>
                        <p><strong>Ph:&nbsp;{summary.doctorPhone}</strong></p>
                        <br>
                        <p style="color: #0070d2;"><strong>Consultation Date:&nbsp;{summary.endDate}</strong>
                        </p>
                    </div>
                    <div class="logo-container">
                        <img src={doctorLogoNew} alt="Consultation Logo" class="consultationn-logo" />
                    </div>
                    <div class="right-info">
                        <p class="hospital-name">{summary.facilityName}</p>
                        <p>{summary.location}</p>
                        <img src={hospitalLogo} alt="Hospital Logo" class="hospital-logo" />
                    </div>
                </div>
            </template>
            <hr class="horizontalLine" />

            <div class="patientdetails-info">
                <div class="pii-row">
                    <div><strong>{summary.patientName}({summary.age}Y/{summary.gender})</strong></div>
                    <div><strong>{summary.pid}</strong></div>
                    <div style="display: flex; align-items: center;">
                        <lightning-icon icon-name="utility:call" size="x-small" alternative-text="Phone"
                            class="slds-m-right_xx-small"></lightning-icon>
                        <span><strong>{summary.phone}</strong></span>
                    </div>
                </div>
            </div>

            <div class="patient-info">
                <div class="info-row">
                    <div><strong>Height:</strong> {summary.height}</div>
                    <div><strong>Weight:</strong> {summary.weight}</div>
                    <div><strong>BP:</strong> {summary.bloodPressure}</div>
                </div>
                <div class="info-row">
                    <div><strong>Pulse:</strong> {summary.pulse}</div>
                    <div><strong>Temperature:</strong> {summary.temperature}</div>
                    <div><strong>SpO2 Level: </strong>{summary.spo2}</div>
                </div>
            </div>
            <div class="section-block">
                <h3><strong>Medical History / चिकित्सीय इतिहास</strong></h3>
                <p>{summary.medicalHistory}</p>
            </div>

            <div class="section-block">
                <h3><strong>Chief Complaints / मुख्य शिकायतें</strong></h3>
                <p>{summary.symptoms}</p>
            </div>

            <div class="section-block">
                <h3><strong>Clinical Findings / नैदानिक निष्कर्ष</strong></h3>
                <p>{summary.clinicalFindings}</p>
            </div>
            <div class="section-block">
                <h3><strong>Clinical Findings testing / नैदानिक निष्कर्ष</strong></h3>
                <p>{summary.clinicalFindings}</p>
            </div>

            <div class="section-block">
                <h3><strong>Diagnosis / निदान</strong></h3>
                <template if:true={formattedDiagnosisList}>
                    <ul>
                        <template for:each={formattedDiagnosisList} for:item="diag">
                            <li key={diag.text}>
                                <div class="slds-grid">
                                    <div class="slds-col slds-size_1-of-2">
                                        <template if:false={isDiagnosisEdit}>
                                            <strong>{diag.type}:</strong> {diag.text}
                                        </template>
                                        <template if:true={isDiagnosisEdit}>
                                           <strong>{diag.type}:</strong> <lightning-input value={diag.text} data-id={diag.id} onchange={handleDiagnosisChange}></lightning-input>
                                           <div class="slds-m-around_medium">
                                                <lightning-button variant="brand" label="Save" class="slds-p-around_xxx-small slds-m-right_small" onclick={handleDiagnosisSave}></lightning-button>
                                                <lightning-button variant="neutral" label="Cancel" class="slds-p-around_xxx-small slds-m-right_small" onclick={handleDiagnosisCancel}></lightning-button>
                                            </div>
                                        </template>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2 slds-text-align_right">
                                       <lightning-button-icon class="slds-p-around_xxx-small slds-m-right_small"
                                        icon-name="utility:edit" alternative-text="Edit" title="Edit"
                                        onclick={handleDiagnosisEditRow}></lightning-button-icon>
                                    </div>
                                </div>
                            </li>
                        </template>
                    </ul>
                </template>
                <template if:false={formattedDiagnosisList}>
                    <p>No diagnoses found.</p>
                </template>
            </div>
            <div class="section-block">
                <h3><strong>Investigations / परीक्षण</strong></h3>
                <table class="symptoms-medhist-table">
                    <thead>
                        <tr>
                            <th style="width: 150px;">Test Name(s)</th>
                            <th> Complete By</th>
                            <th> Status </th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={summary.csrs} for:item="csr">
                            <tr key={csr.id}>
                                <td>{csr.RequestedTest}</td>
                                <td>{csr.RequestedCompletionDate}</td>
                                <td>{csr.medStatus}</td>
                                <td>
                                    <lightning-button-icon class="slds-p-around_xxx-small slds-m-right_small"
                                        icon-name="utility:edit" alternative-text="Edit" title="Edit" data-name={csr.id}
                                        onclick={handleInvestigationEditRow}></lightning-button-icon>
                                    <lightning-button-icon class="slds-m-right_small" icon-name="utility:delete"
                                        alternative-text="Remove" title="Remove" name={csr.RequestedTest} data-name={csr.id} onclick={removeRow}></lightning-button-icon>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
                <div class="slds-m-around_medium">
                    <lightning-button variant="brand" label="Add Investigation" onclick={addInvestigationRow}></lightning-button>
                </div>
                
                <template if:true={isCsrEmpty}>
                    <p>No clinical service requests found.</p>
                </template>
            </div>

            <div class="section-block">
                <h3><strong>Medication / दवाएं</strong></h3>
                <table class="symptoms-medhist-table">
                    <thead>
                        <tr>
                            <th style="width: 150px;">Medication Name</th>
                            <th>Duration (Days)</th>
                            <th>Dosage</th>
                            <th>Start Date</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={medicationList} for:item="med">
                            <tr key={med.id}>
                                <td>{med.medicationName}</td>
                                <td class="right-med">{med.duration}</td>
                                <td>{med.dosage}</td>
                                <td>{med.startDate}</td>
                                <td>
                                    <lightning-button-icon class="slds-p-around_xxx-small slds-m-right_small"
                                        icon-name="utility:edit" alternative-text="Edit" title="Edit" name={med.index}
                                        data-name={med.id} onclick={handleEditRow}></lightning-button-icon>
                                    <lightning-button-icon class="slds-m-right_small" icon-name="utility:delete"
                                        alternative-text="Remove" title="Remove" name={med.medicationName}
                                        data-name={med.id} onclick={removeRow}></lightning-button-icon>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
                <div class="slds-m-around_medium">
                    <lightning-button variant="brand" label="Add Medication" onclick={addMedicationRow}></lightning-button>
                </div>
                
                <template if:true={isMedicationEmpty}>
                    <p>No medications found.</p>
                </template>
            </div>
            <div class="section-block">
                <h3><strong>Care Instructions / देखभाल निर्देश</strong></h3>
                <p style="white-space:pre-line;">{formattedCareInstructions}</p>
            </div>

            <div class="section-block">
                <h3 class="followup-heading">
                    <strong>Follow-Up Date / अनुवर्ती तिथि : </strong>
                    <span>{summary.followUpDate}</span>
                </h3>
            </div>
            <hr class="horizontalLine" />
            <!-- </div> -->

            <!-- modal footer start-->
            <!-- <footer class="slds-modal__footer"> -->
            <div class="slds-modal__footer">
                <button class="slds-button slds-button_neutral" onclick={hideModalBox}>Cancel</button>
                <button class="slds-button slds-button_brand" onclick={handleSendForApproval}>Approve</button>
            </div>
        </div>
        <!-- </footer> -->

        <!-- </div> -->
        <!-- </section>
        <div class="slds-backdrop slds-backdrop_open"></div>         -->
    </template>
    <template if:true={showEditModal}>
        <!-- <section role="dialog" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container"> -->
        <div class="slds-modal__header">
            <!-- <button class="slds-button slds-button_icon slds-modal__close" title="Close" onclick={closeModals}>
                        <lightning-icon icon-name="utility:close" alternative-text="close"
                            size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button> -->
            <h2 class="slds-text-heading_medium">
                {medicationHeading}
            </h2>
        </div>
        <div class="slds-modal__content slds-p-around_medium">
            <lightning-record-edit-form object-api-name="MedicationRequest" record-id={selectedMedicationRowId}
                onload={dataLoaded} onsubmit={handleSubmit} onsuccess={handleSaveSuccess} onerror={handleError}
                oncancel={closeModals}>
                <lightning-messages></lightning-messages>
                <lightning-input-field field-name="MedicationId"></lightning-input-field>
                <lightning-input-field field-name="Duration_Days__c"></lightning-input-field>
                <lightning-input-field field-name="Prescription_Start_Date__c"
                    value={addMedicationStartDate}></lightning-input-field>
                <lightning-input-field field-name="Morning__c"></lightning-input-field>
                <lightning-input-field field-name="Afternoon__c"></lightning-input-field>
                <lightning-input-field field-name="Night__c"></lightning-input-field>
                <lightning-input-field field-name="BF_AF__c"></lightning-input-field>
                <template if:true={isAddMedication}>
                    <lightning-input-field field-name="PatientId" value={summary.patientId}
                        disabled></lightning-input-field>
                    <lightning-input-field field-name="ClinicalEncounterId" value={encounterName}
                        disabled></lightning-input-field>
                </template>

                <div class="slds-m-top_medium">
                    <lightning-button type="submit" label="Save" variant="brand"></lightning-button>
                    <lightning-button label="Cancel" onclick={closeModals} class="slds-m-left_small"></lightning-button>
                </div>
            </lightning-record-edit-form>
        </div>
        <!-- </div> -->
        <!-- </section>
        <div class="slds-backdrop slds-backdrop_open"></div> -->
    </template>
    <template if:true={showInvestigationEditModal}>
        <div class="slds-modal__header">
            <h2 class="slds-text-heading_medium">
                {investigationHeading}
            </h2>
        </div>
        <div class="slds-modal__content slds-p-around_medium">
            <lightning-record-edit-form object-api-name="ClinicalServiceRequest" record-id={selectedInvestigationRowId}
                onload={dataInvestigationLoaded} onsubmit={handleInvestigationSubmit} onsuccess={handleInvestigationSaveSuccess} onerror={handleError}
                oncancel={closeModals}>
                <lightning-messages></lightning-messages>
                <lightning-input-field field-name="Requested_Test__c"></lightning-input-field>
                <lightning-input-field field-name="Requested_Completion_Date__c"></lightning-input-field>
                <lightning-input-field field-name="Status" value={investigationStatus}></lightning-input-field>
                <template if:true={isAddInvestigation}>
                    <lightning-input-field field-name="PatientId" value={summary.patientId}
                        disabled></lightning-input-field>
                    <lightning-input-field field-name="EncounterId" value={encounterName}
                        disabled></lightning-input-field>
                </template>
                <div class="slds-m-top_medium">
                    <lightning-button type="submit" label="Save" variant="brand"></lightning-button>
                    <lightning-button label="Cancel" onclick={closeModals} class="slds-m-left_small"></lightning-button>
                </div>
            </lightning-record-edit-form>
        </div>
    </template>
    <template if:true={showDeleteModal}>
        <div class="custom-backdrop">
            <div class="custom-modal">
                <h2 class="slds-text-heading_medium slds-text-align_center">Delete Confirmation</h2>
                <div class="custom-body">
                    <p><strong>{deleteMedicationName}</strong> - Are you sure you want to delete this?<br />
                        Deleting here will permanently remove it from the prescription.</p>
                </div>
                <div class="custom-footer">
                    <button class="delete-button" onclick={handleDelete}>Delete</button>
                    <button class="cancel-button" onclick={clodeDeleteModal}>Cancel</button>
                </div>
            </div>
        </div>
    </template>
</template>

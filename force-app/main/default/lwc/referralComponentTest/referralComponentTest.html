<template>

    <template if:true={isShowDraftSelectionModal}>
        <div class="slds-card clinical-encounters-container slds-modal_large">
            <div class="slds-card__header slds-grid slds-grid_align-spread header-fixed-top">
                <div class="header-left-section">
                    <img src={leftCornerImageUrl} alt="PMJAY Logo" class="corner-icon left-logo-image" />
                </div>

                <div class="slds-col slds-size_12-of-24 slds-text-align_center">
                    <p style="font-size: 1.2rem; font-weight: 500; margin: 0;">
                        Draft Referrals:
                        <span style="font-size: 1.2rem; font-weight: 500; margin-left: 4px;">{patientName}/{age}Y</span>
                    </p>
                </div>

                <div class="header-right-section">
                    <img src={rightCornerImageUrl} alt="Government Logo" class="corner-icon right-logo-image" />
                </div>
            </div>

            <div class="fixed-content-top slds-card__body_inner slds-p-vertical_xx-small slds-text-align_center">
                <div class="info_comp1">
                    <p class="slds-text-body_small note ">
                        <span class="" style="font-size: 15.1px;">Select a Draft Referral to continue or create a New
                            Referral / ड्राफ्ट रेफरल जारी रखने के लिए चुनें या नया रेफरल बनाएं।</span>
                    </p>
                </div>
            </div>

            <div class="selection-actions slds-grid slds-m-bottom_medium slds-card__body_inner">
                <div class="slds-col slds-size_3-of-12"></div>
            </div>

            <!-- Draft Referrals Table -->
            <div class="scrollable-records-list">
                <div class="encounter-list">
                    <template if:true={draftReferrals}>
                        <!-- Table Header -->
                        <div class="encounter-header table-header-style">
                            <div class="slds-grid slds-grid_vertical-align-center">
                                <div class="slds-col slds-size_1-of-12 slds-p-right_small">
                                    <!-- Checkbox column header -->
                                </div>
                                <div class="slds-col slds-size_2-of-12 slds-p-right_small slds-m-left_small">
                                    <p class="field-label header-text">Created Date</p>
                                </div>
                                <div class="slds-col slds-size_3-of-12 slds-p-right_small">
                                    <p class="field-label header-text">Primary Specialty</p>
                                </div>
                                <div class="slds-col slds-size_4-of-12 slds-p-right_small">
                                    <p class="field-label header-text">Referred To</p>
                                </div>
                                <div class="slds-col slds-size_2-of-12  ">
                                    <p class="field-label header-text">Priority</p>
                                </div>
                                <!-- <div class="slds-col slds-size_1-of-12">
                                <p class="field-label header-text">Action</p>
                            </div> -->
                            </div>
                        </div>

                        <!-- Table Rows -->
                        <template for:each={draftReferrals} for:item="draftReferral">
                            <div key={draftReferral.referralId} class="encounter-card slds-card slds-m-bottom_small"
                                data-id={draftReferral.referralId} onclick={handleDraftSelect} style="cursor: pointer;">
                                <div
                                    class="slds-card__body slds-card__body_inner slds-grid slds-grid_vertical-align-center slds-wrap">
                                    <div class="slds-col slds-size_1-of-12 slds-p-right_small">
                                        <lightning-input type="radio" name="draftReferralRadio"
                                            checked={draftReferral.selected} data-id={draftReferral.referralId}
                                            onchange={handleDraftSelect} label="">
                                        </lightning-input>
                                    </div>
                                    <div class="slds-col slds-size_2-of-12 slds-p-right_small">
                                        <lightning-button variant="base" label={draftReferral.createdDate}
                                            title={draftReferral.createdDate} data-id={draftReferral.referralId}
                                            onclick={handleReferralClick} class="encounter-link">
                                        </lightning-button>
                                    </div>
                                    <div class="slds-col slds-size_3-of-12 slds-p-right_small">
                                        <p class="field-value" title={draftReferral.primarySpecialty}>
                                            {draftReferral.primarySpecialty}
                                        </p>
                                    </div>
                                    <div class="slds-col slds-size_4-of-12 slds-p-right_small">
                                        <p class="field-value" title={draftReferral.referredToName}>
                                            {draftReferral.referredToName}
                                        </p>
                                    </div>
                                    <div class="slds-col slds-size_2-of-12 slds-p-left_small"
                                        style="padding-left: 23px;">
                                        <lightning-badge label={draftReferral.referralPriority}
                                            variant={draftReferral.priorityVariant}
                                            style="width: 75px; justify-content: center;">
                                        </lightning-badge>
                                    </div>
                                    <!-- <div class="slds-col slds-size_1-of-12"> -->
                                    <!-- Action menu removed for simplicity -->
                                    <!-- </div> -->
                                </div>
                            </div>
                        </template>
                    </template>

                    <template if:false={draftReferrals}>
                        <div class="slds-align_absolute-center slds-var-p-around_medium">
                            <div class="slds-text-align_center">
                                <lightning-icon icon-name="utility:note" size="large"
                                    variant="neutral"></lightning-icon>
                                <p class="slds-text-heading_medium slds-m-top_small">No Draft Referrals Found</p>
                                <p class="slds-text-body_regular slds-text-color_weak">
                                    You don't have any draft referrals for this patient.
                                </p>
                            </div>
                        </div>
                    </template>

                    <template if:true={error}>
                        <div class="slds-text-color_error slds-align_absolute-center slds-var-p-around_medium">
                            <lightning-icon icon-name="utility:error" size="small" variant="error"
                                class="slds-m-right_x-small"></lightning-icon>
                            An error occurred: {error.body.message}
                        </div>
                    </template>
                </div>
            </div>

            <!-- Footer with action buttons -->
            <div class="slds-card__footer slds-text-align_right slds-p-around_medium footer-fixed-bottom">
                <lightning-button label="Cancel" variant="neutral" onclick={handleCancel} class="slds-m-right_small">
                </lightning-button>
                <lightning-button label="Use Selected Draft" variant="brand" onclick={handleUseSelectedDraft}
                    disabled={isSelectedDraftDisabled} class="slds-m-right_small">
                </lightning-button>
                <lightning-button label="New Referral" variant="brand-outline" onclick={handleCreateNewReferral}>
                </lightning-button>
            </div>
        </div>
    </template>


    <template if:true={isShowMainModel}>
        <div class="slds-card clinical-encounters-container slds-modal_large">
            <div class="slds-card__header slds-grid slds-grid_align-spread header-fixed-top">
                <div class="header-left-section">
                    <img src={leftCornerImageUrl} alt="PMJAY Logo" class="corner-icon left-logo-image" />
                </div>

                <div class="slds-col slds-size_12-of-24 slds-text-align_center">
                    <p style="font-size: 1.1rem; font-weight: 600; margin: 0;">
                        <span style="font-size: 1.4rem; font-weight: 500; margin-left: 4px;">{patientName}/{age}Y</span>
                    </p>
                </div>

                <div class="header-right-section">
                    <img src={rightCornerImageUrl} alt="Government Logo" class="corner-icon right-logo-image" />
                </div>
            </div>

            <div class="fixed-content-top slds-card__body_inner slds-p-vertical_xx-small slds-text-align_center">
                <div class="info_comp1">
                    <!-- <lightning-icon
                    icon-name="utility:info"
                    alternative-text="Information"
                    title="More Info"
                    size="x-small"
                    class="slds-m-left_xx-small">
                </lightning-icon> -->
                    <p class="slds-text-body_small note ">
                        <span class="slds-text-heading_small">Select the Consultation(s) whose summary will be used /
                            परामर्श चुनें - इसका सारांश बनाया जाएगा।</span>
                    </p>
                </div>

            </div>

            <div class="selection-actions slds-grid slds-m-bottom_medium slds-card__body_inner">
                <div class="slds-col slds-size_3-of-12"></div>
            </div>

            <!-- table starts here -->

            <div class="scrollable-records-list">
                <div class="encounter-list">
                    <template if:true={clinicalEncounters}>
                        <!-- Table Header -->
                        <div class="encounter-header table-header-style">
                            <div class=" slds-grid slds-grid_vertical-align-center ">
                                <div class="slds-col slds-size_1-of-12 slds-p-right_small">
                                    <!-- Checkbox column header -->
                                </div>
                                <div class="slds-col slds-size_2-of-12 slds-p-right_small slds-m-left_small">
                                    <p class="field-label header-text">Date</p>
                                </div>
                                <div class="slds-col slds-size_6-of-12 slds-p-right_small ">
                                    <p class="field-label header-text">Diagnosis</p>
                                </div>
                                <div class="slds-col slds-size_3-of-12 ">
                                    <p class="field-label header-text">Doctor</p>
                                </div>
                            </div>
                        </div>

                        <!-- Table Rows -->
                        <template for:each={clinicalEncounters} for:item="encounter">
                            <div key={encounter.encounterId} class="encounter-card slds-card slds-m-bottom_small"
                                data-id={encounter.encounterId} onclick={handleCardClick} style="cursor: pointer;">
                                <div
                                    class="slds-card__body slds-card__body_inner slds-grid slds-grid_vertical-align-center slds-wrap">
                                    <div class="slds-col slds-size_1-of-12 slds-p-right_small">
                                        <lightning-input type="checkbox" name="encounterCheckbox"
                                            checked={encounter.selected} data-id={encounter.encounterId}
                                            onchange={handleEncounterSelection} onclick={handleCheckboxClick} label="">
                                        </lightning-input>
                                    </div>
                                    <div class="slds-col slds-size_2-of-12 slds-p-right_small">
                                        <lightning-button variant="base" label={encounter.encounterDate}
                                            title={encounter.encounterDate} data-id={encounter.encounterId}
                                            onclick={handleEncounterClick} class="encounter-link">
                                        </lightning-button>
                                    </div>
                                    <div class="slds-col slds-size_6-of-12 slds-p-right_small">
                                        <p class="field-value diagnosis-text-2" title={encounter.diagnosis}
                                            onclick={toggleDiagnosisExpansion} data-id={encounter.encounterId}
                                            style="cursor: pointer;">
                                            {encounter.diagnosis}
                                        </p>
                                    </div>
                                    <div class="slds-col slds-size_3-of-12 slds-p-left_small">
                                        <p class="field-value">{encounter.prescribingDoctor}</p>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </template>
                    <template if:false={clinicalEncounters.length}>
                        <div class="slds-align_absolute-center slds-var-p-around_medium slds-text-heading_small">
                            <p>This patient has no approved clinical encounters.</p>
                        </div>
                    </template>

                    <template if:true={error}>
                        <div class="slds-text-color_error slds-align_absolute-center slds-var-p-around_medium">
                            An error occurred: {error.body.message}
                        </div>
                    </template>
                </div>
            </div>



            <div class="slds-card__footer slds-text-align_right slds-p-around_medium footer-fixed-bottom">
                <lightning-button label="Cancel" variant="neutral" onclick={handleCancel} class="slds-m-right_small">
                </lightning-button>
                <lightning-button label="Select Provider" variant="brand" onclick={handleProceed}
                    class="slds-border-radius_none" disabled={proceedButtonDisabled}></lightning-button>
            </div>
        </div>
    </template>
    <template if:true={isShowReferralModal}>
        <div class="healthcare-provider-search-container">
            <header class="healthcare-provider-header slds-grid slds-grid_align-spread">
                <div class="header-left-section1">
                    <!-- Swapped src and alt attributes -->
                    <img src={leftCornerImageUrl} alt="PMJAY Logo" class="left-corner-image medium-image" />
                </div>

                <div class="healthcare-component-header">
                    <h1 class="header-title"> Search Empanelled Healthcare Provider</h1>
                </div>



                <div class="header-right-section2">
                    <!-- Swapped src and alt attributes -->
                    <img src={rightCornerImageUrl} alt="Government Logo" class="right-corner-icon " />
                </div>
            </header>

            <div class="search-section-page">
                <span class="search-section-title">
                    Select the Specialty(s) to which you would like to refer the Patient /
                    मरीज़ को रेफर करने के लिए विशेषज्ञता चुनें।
                </span>
                <div class="search-form-page">
                    <div class="single-form-row">
                        <lightning-combobox name="primarySpecialty" label="Primary Specialty" placeholder="Select"
                            options={specialtyOptions} value={searchCriteria.primarySpecialty}
                            data-field="primarySpecialty" onchange={handleInputChange} required class="custom-combobox">
                        </lightning-combobox>

                        <lightning-combobox name="secondarySpecialty" label="Secondary Specialty" placeholder="Select"
                            options={specialtyOptions} value={searchCriteria.secondarySpecialty}
                            data-field="secondarySpecialty" onchange={handleInputChange} class="custom-combobox">
                        </lightning-combobox>

                        <lightning-combobox label="City" placeholder="Select" value={searchCriteria.city}
                            options={cityOptions} data-field="city" onchange={handleInputChange} required
                            class="custom-combobox">
                        </lightning-combobox>

                        <lightning-combobox name="hospitalType" label="Hospital Type" placeholder="Select"
                            options={hospitalTypeOptions} value={searchCriteria.hospitalType} data-field="hospitalType"
                            onchange={handleInputChange} class="custom-combobox">
                        </lightning-combobox>
                    </div>
                    <div class="search-button-wrapper-page">
                        <button class="generate-summary-btn" onclick={handleSearch} disabled={isLoadingProviders}>
                            <svg class="icon" viewBox="0 0 24 24">
                                <path
                                    d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" />
                            </svg>
                            <span>Search</span>
                        </button>
                    </div>
                </div>
            </div>

            <template if:true={isLoadingProviders}>
                <div class="loading-container">
                    <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
                </div>
            </template>

            <template if:false={isLoadingProviders}>
                <template if:true={showResults}>
                    <div class="results-section-page">
                        <h3 class="results-title-page">Search Results ({searchResults.length})</h3>

                        <template if:true={hasResults}>
                            <div class="results-scroll-wrapper">
                                <div class="results-grid-page">
                                    <template for:each={searchResults} for:item="provider">
                                        <div key={provider.Id} class={provider.cardClass} data-id={provider.Id}
                                            onclick={handleProviderCardClick} tabindex="0" role="button">

                                            <div class="provider-content-page">
                                                <div class="provider-selection-radio">
                                                    <lightning-input type="radio" name="providerSelection"
                                                        value={provider.Id} checked={provider.isSelected}
                                                        data-id={provider.Id} onchange={handleProviderSelection}>
                                                    </lightning-input>
                                                </div>

                                                <div class="provider-details-page">

                                                    <h4 class="provider-name-page"><span>🏥</span> {provider.Name}</h4>

                                                    <template if:true={provider.displayAddress}>
                                                        <p class="provider-address-page">
                                                            <span>📍</span>
                                                            <span class="address-text">{provider.displayAddress}</span>
                                                        </p>
                                                    </template>
                                                </div>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>

                        </template>

                        <template if:false={hasResults}>
                            <div class="no-results-page">
                                <p>No healthcare providers found matching your search criteria.</p>
                                <p>Try adjusting your search parameters and search again.</p>

                            </div>
                        </template>
                    </div>
                </template>
            </template>

            <footer class="healthcare-provider-footer">
                <button class="lightning-btn lightning-btn--neutral" onclick={handleBackToMainModal}>
                    Back
                </button>
                <button class="lightning-btn lightning-btn--brand " onclick={handleProceedToCaseFile}
                    disabled={isProceedToCaseFileDisabled}>
                    Proceed to Refer
                </button>
            </footer>
        </div>
    </template>

    <template if:true={isShowCaseFileModal}>
        <!-- start -->
        <div class="case-file-container">

            <div class="component-header">
                <div class="header-left-section1">
                    <!-- Swapped src and alt attributes -->
                    <img src={leftCornerImageUrl} alt="PMJAY Logo" class="left-corner-image medium-image" />
                </div>

                <h1 class="header-title">{summaryTitle}</h1>

                <div class="header-right-section2">
                    <!-- Swapped src and alt attributes -->
                    <img src={rightCornerImageUrl} alt="Government Logo" class="right-corner-icon " />
                </div>

                <!-- <div class="logo-section">
                    <img src={logoUrl} alt="Case File Logo" class="document-logo" />
                </div> -->

            </div>

            <!-- Loading Spinner -->
            <template if:true={isLoadingCaseFile}>
                <div class="loading-container">
                    <lightning-spinner alternative-text="Loading case file data..." size="medium"></lightning-spinner>
                    <div class="loading-message">
                        <p>Generating Referral Summary</p>
                    </div>
                </div>
            </template>




            <!-- Error Message -->
            <template if:true={error}>
                <div class="error-container">
                    <lightning-icon icon-name="utility:error" variant="error" size="small"></lightning-icon>
                    <span class="error-message">{error}</span>
                </div>
            </template>

            <!-- Case File Content -->
            <template if:false={isLoadingCaseFile}>
                <template if:false={error}>

                    <div class="case-file-document">
                        <template if:true={isLoadingReferralCreation}>
                            <div class="loading-container">
                                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
                                <div class="loading-message">
                                    <p>{currentLoadingMessage}</p>
                                </div>
                            </div>
                        </template>

                        <!-- Logo Section -->


                        <!-- Document Title  -->
                        <!-- <div class="document-title">
                        <h2>Patient Referral Summary</h2>
                    </div> -->

                        <!-- Top Header Row -->
                        <template if:false={isLoadingReferralCreation}>
                            <div class="referTo">
                                <span>Referring to: {selectedProviderName}</span>
                            </div>
                            <div class="top-header-row">
                                <div class="header-item">
                                    <strong>Referral ID: </strong>
                                    <span class="value">{currentReferralName}</span>
                                </div>
                                <div class="header-item">
                                    <strong>{caseData.patientName}/{caseData.patientAge}Y</strong>
                                </div>
                                <div class="header-item">
                                    <strong>Mob: {caseData.patientPhone}</strong>
                                </div>
                            </div>

                            <!-- Horizontal Line -->
                            <div class="divider"></div>

                            <!-- Patient Information Grid -->
                            <div class="patient-info-grid">
                                <!-- Left Column -->
                                <div class="info-column">
                                    <div class="info-row">
                                        <span class="label">Gender:</span>
                                        <span class="value">{caseData.gender}</span>
                                    </div>
                                    <div class="info-row">
                                        <span class="label">PMJAY ID:</span>
                                        <span class="value">{caseData.pmJayId}</span>
                                    </div>
                                    <div class="info-row">
                                        <span class="label">Aadhar Number:</span>
                                        <span class="value">{caseData.aadharNumber}</span>
                                    </div>
                                    <div class="info-row">
                                        <span class="label">Attendant Name:</span>
                                        <span class="value">{caseData.attendantName}</span>
                                    </div>
                                    <div class="info-row">
                                        <span class="label">Attendant Phone:</span>
                                        <span class="value">{caseData.attendantPhone}</span>
                                    </div>
                                </div>
                                <!-- Right Column -->
                                <div class="info-column">

                                    <div class="info-row">
                                        <span class="label">Referring PHWC:</span>
                                        <span class="value">{caseData.facilityName}</span>
                                    </div>
                                    <div class="info-row">
                                        <span class="label">Referring Doctor</span>
                                        <span class="value">{caseData.doctorName}</span>
                                    </div>
                                    <div class="info-row">
                                        <span class="label">Doctor's Phone:</span>
                                        <span class="value">{caseData.doctorPhone}</span>
                                    </div>
                                    <div class="info-row">
                                        <span class="label">Referred Primary Specialty:</span>
                                        <span class="value">{primarySpecialityName}</span>
                                    </div>
                                    <div class="info-row">
                                        <span class="label">Referred Secondary Specialty:</span>
                                        <span class="value">{displaySecondarySpecialty}</span>
                                    </div>
                                </div>
                            </div>

                            <!-- Input Fields Section -->


                            <!-- Horizontal Line -->
                            <div class="divider"></div>

                            <div class="slds-card slds-m-top_medium">
                                <!-- <div class="slds-card__header">
                    <h2 class="slds-card__header-title slds-text-heading_small">
                        Referral Details
                    </h2>
                </div> -->
                                <div class="slds-card__body slds-card__body_inner bold-label">
                                    <div class="slds-grid slds-gutters slds-wrap slds-p-bottom_none">
                                        <!-- Recommended Visit By Date Field -->
                                        <div
                                            class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-left_none ">
                                            <lightning-input type="date" name="recommendedVisitBy"
                                                label="Recommended Visit Before" value={recommendedVisitBy}
                                                onchange={handleRecommendedVisitByChange} required
                                                class="slds-m-bottom_small">
                                            </lightning-input>
                                        </div>

                                        <!-- Referral Priority Picklist -->
                                        <div
                                            class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-right_none">
                                            <lightning-combobox name="referralPriority" label="Referral Priority"
                                                value={referralPriority} placeholder="Select Priority"
                                                options={priorityOptions} onchange={handleReferralPriorityChange}
                                                required class="slds-m-bottom_small">
                                            </lightning-combobox>
                                        </div>
                                    </div>
                                </div>
                            </div>


                            <!-- Referral and Care Summary Section -->
                            <div class="textarea-section">

                                 <div class="textarea-container">
                                    <div class="AI_headingContainer">
                                        <div class="info-iconTitle-container"><label class="textarea-label"
                                                for="referralSummaryBYAI">Referral Summary / रेफ़रल सारांश
                                            </label>
                                            <!-- <lightning-icon icon-name="utility:info" alternative-text="Information"
                                                title="This data has been pulled from the latest Consultation"
                                                size="x-small" class="slds-m-left_xx-small slds-m-top_xx-small">
                                            </lightning-icon> -->
                                        </div>


                                         <div class="AI_helperTextSection">
                                            <img src={genAI} alt="genAI" class="genAI" title="This summary was generated by AI">
                                         <span class="helper-text">This summary was generated by AI</span>
                                         </div>
                                    </div>


                                    <textarea id="referralSummaryBYAI" name="referralSummaryBYAI" class="custom-textarea"
                                        placeholder="Referral Summary"
                                        onchange={handleReferralSummaryChange}>{referralSummaryBYAI}</textarea>
                                </div>

                                <div class="ai-confirmation">
                                    <lightning-input type="checkbox" name="aiConfirmationCheckbox"
                                        onchange={handleAiConfirmationChange} class="ai-confirmation-checkbox">

<template>
    <template if:true={isShowPreviewBody}>
        <header class="slds-modal__header">
            <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Confirmation</h2>
        </header>

        <div class="slds-grid slds-p-around_small slds-grid_vertical">
            <template if:true={spinnerStatus}>
                <div class="slds-spinner_container slds-is-relative">
                    <lightning-spinner alternative-text="Loading" size="medium" variant="brand"></lightning-spinner>
                </div>
            </template>
            <p class="slds-text-align_center">
                Are you sure you want to send the email?
            </p>
        </div>

        <footer class="slds-modal__footer">
            <div class="slds-text-align_right slds-p-around_small">
                <lightning-button variant="neutral" class="slds-m-right_small" label="Cancel"
                    onclick={handleCloseClick}></lightning-button>
                <lightning-button variant="brand" label="Send Email" onclick={confirmSendEmail}></lightning-button>
            </div>
        </footer>
    </template>

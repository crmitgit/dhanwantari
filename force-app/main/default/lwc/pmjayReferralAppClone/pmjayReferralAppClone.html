            <div class="content-card" style={backgroundStyle}>
                <template if:true={isLoggedIn}>
                    <div class="session-header">
                        <lightning-button-menu
                            alternative-text="Hospital Menu"
                            menu-alignment="right"
                            class="hospital-menu"
                            icon-name="standard:account"
                        >
                            <div class="hospital-info">
                                <span class="hospital-label">
                                    Empanelled Hospital / सूचीबद्ध अस्पताल
                                </span>
                                <span class="hospital-name">
                                    {loggedInHospital}
                                </span>
                            </div>

                            <lightning-menu-item
                                label="Logout / लॉगआउट"
                                value="logout"
                                onclick={handleLogout}>
                            </lightning-menu-item>
                        </lightning-button-menu>
                    </div>
                </template>

                <template if:true={isLoading}>
                    <lightning-spinner alternative-text="Loading / लोड हो रहा है" size="large"></lightning-spinner>
                </template>

                <template if:true={showInitialSelection}>
                    <div class="main-selection-container">
                         <div class="selection-card" onclick={handlePatientReportCard}>
                            <div class="card-icon-container">
                                <lightning-icon icon-name="utility:file" size="large" class="card-line-icon" alternative-text="Patient Health Records"></lightning-icon>
                            </div>
                            <h2 class="selection-card-title">Patient Health Records</h2>
                            <p class="selection-card-description">Diagnostic results and clinical reports.</p>
                            <button class="custom-button icon-button">
                                <lightning-icon icon-name="utility:arrow_right" size="small" class="button-icon-right" variant="inverse"></lightning-icon>
                            </button>
                        </div>

                        <div class="selection-card" onclick={handlePatientReceivedClick}>
                            <div class="card-icon-container">
                                <lightning-icon icon-name="utility:checkin" size="large" class="card-line-icon" alternative-text="Patient Received"></lightning-icon>
                            </div>
                            <h2 class="selection-card-title">Patient Received</h2>
                            <p class="selection-card-description">Patient arrived at Empanelled Healthcare Provider</p>
                            <button class="custom-button icon-button">
                                <lightning-icon icon-name="utility:arrow_right" size="small" class="button-icon-right" variant="inverse"></lightning-icon>
                            </button>
                        </div>

                        <div class="selection-card" onclick={handlePatientCareTransitionClick}>
                            <div class="card-icon-container">
                                <lightning-icon icon-name="utility:reply" size="large" class="card-line-icon" alternative-text="Patient Care Transition"></lightning-icon>
                            </div>
                            <h2 class="selection-card-title">Patient Care Transition</h2>
                            <p class="selection-card-description">Refer patient back to PHWC</p>
                            <button class="custom-button icon-button">
                                <lightning-icon icon-name="utility:arrow_right" size="small" class="button-icon-right" variant="inverse"></lightning-icon>
                            </button>
                        </div>

                        <!-- Referral Validation card hidden for now
                        <div class="selection-card" onclick={handleReferralValidationClick}>
                            <div class="card-icon-container">
                                <span class="emoji-icon">🛡️</span> </div>
                            <h2 class="selection-card-title">Referral Validation</h2>
                            <p class="selection-card-description">Verify the incoming referral against PHWC records before admission.</p>
                            <button class="custom-button icon-button">
                                <lightning-icon icon-name="utility:arrow_right" size="small" class="button-icon-right" variant="inverse"></lightning-icon>
                            </button>
                        </div>
                        -->

                    </div>
                </template>

                <template if:true={showValidationSearch}>
                    <div class="step-content colFlex" style="background:transparent;">
                        <div class="step-content-inner">
                            <p class="description-text description-color">
                                Enter the 'RF-' prefixed referral ID to check it against the PHWC record before admission /
                                भर्ती से पहले PHWC रिकॉर्ड से जांचने के लिए 'RF-' से शुरू होने वाली रेफरल आईडी दर्ज करें
                            </p>
                            <div class="search-input-group">
                                <input type="text" name="validationReferralInput" value={validationReferralInput}
                                    oninput={handleValidationInput} onkeydown={handleValidationKeyDown}
                                    placeholder="Enter Referral ID / रेफरल आईडी दर्ज करें" class="custom-input search-input" />
                                <button class="custom-button search-button" onclick={handleOpenValidation}>
                                    Validate / जांचें
                                </button>
                            </div>
                        </div>
                        <div class="button-group">
                            <button class="custom-button secondary-button" onclick={handlePrevious}>Back / पीछे जाएं</button>
                        </div>
                    </div>
                    <template if:true={validationReferralName}>
                        <c-referral-validation-panel
                            referral-name={validationReferralName}
                            hospital-name={loggedInHospital}
                            onclose={handleValidationClose}
                            onvalidationerror={handleValidationError}>
                        </c-referral-validation-panel>
                    </template>
                </template>

                <template if:false={showInitialSelection}>
                    <template if:true={isStep1}>
                        <template if:true={showCityHospitalInput}>
                            <div class="step-content">
                                <div class="step-content-inner center" style={backgroundStyle}>
                                    <p class="description-text description-color">Select your City and Hospital / अपना शहर और अस्पताल चुनें</p>
                                    <div class="input-row">
                                        <div class="input-group">
                                            <lightning-combobox
                                                name="selectedCity"
                                                label="City / शहर " value={selectedCity}
                                                options={cityOptions}
                                                onchange={handleInputChange}
                                                onkeydown={handleKeyDown} placeholder="Select City"
                                                class="custom-combobox curved-dropdown"
                                                required
                                                id="cityCombobox"
                                            ></lightning-combobox>
                                        </div>
                                        <div class="input-group">
                                            <label for="hospitalCombobox" style="font-size: 12px; font-weight: 500; color: #343a40; margin-bottom: 4px;"></label>
                                            <lightning-combobox
                                                name="selectedHospital"
                                                label="Empanelled Hospital / सूचीबद्ध अस्पताल " value={selectedHospital}
                                                options={hospitalOptions}
                                                onchange={handleInputChange}
                                                onkeydown={handleKeyDown} placeholder="Select Hospital"
                                                class="custom-combobox curved-dropdown"
                                                required
                                                id="hospitalCombobox"
                                            ></lightning-combobox>
                                        </div>
                                    </div>
                                    <div class="security-info-box">
                                        <div class="info-text description-color">
                                            <p><strong class="info-bold-text">Please Note / कृपया ध्यान दें</strong></p>
                                            <p>An OTP will be sent to the hospital's registered Mobile Number. Ensure the number is accessible to complete verification. / अस्पताल के रजिस्टर्ड मोबाइल नंबर पर एक ओटीपी भेजा जाएगा। वेरिफाई करने के लिए, सुनिश्चित करें कि नंबर उपलब्ध हो।</p>
                                        </div>
                                    </div>
                                    <div class="button-group">
                                        <!-- <button class="custom-button secondary-button" onclick={handleGoBackToSelection}>Back / वापस जाएं</button> -->
                                        <button class="custom-button primary-button" onclick={handleSendOtp}>
                                            Enter OTP / ओटीपी डालें
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </template>
                        <template if:true={showOtpInput}>
                            <div class="step-content step2-content center" style={backgroundStyle}>
                                <div class="step-content-inner">
                                    <p class="description-text description-color">Enter the OTP sent to <strong class="description-color">{maskedPhoneNumber}</strong> / <strong class="description-color">{maskedPhoneNumber}</strong> पर भेजे गए OTP को दर्ज करें</p>
                                    <div class="otp-input-container">
                                        <input type="text" inputmode="numeric" pattern="[0-9]*" class="otp-input" name="otp1" value={otp1}
                                            oninput={handleOtpInput} onkeydown={handleOtpKeydown} onfocus={handleOtpFocus} onpaste={handleOtpPaste}
                                            maxlength="1" />
                                        <input type="text" inputmode="numeric" pattern="[0-9]*" class="otp-input" name="otp2" value={otp2}
                                            oninput={handleOtpInput} onkeydown={handleOtpKeydown} onfocus={handleOtpFocus}
                                            maxlength="1" />
                                        <input type="text" inputmode="numeric" pattern="[0-9]*" class="otp-input" name="otp3" value={otp3}
                                            oninput={handleOtpInput} onkeydown={handleOtpKeydown} onfocus={handleOtpFocus}
                                            maxlength="1" />
                                        <input type="text" inputmode="numeric" pattern="[0-9]*" class="otp-input" name="otp4" value={otp4}
                                            oninput={handleOtpInput} onkeydown={handleOtpKeydown} onfocus={handleOtpFocus}
                                            maxlength="1" />
                                        <input type="text" inputmode="numeric" pattern="[0-9]*" class="otp-input" name="otp5" value={otp5}
                                            oninput={handleOtpInput} onkeydown={handleOtpKeydown} onfocus={handleOtpFocus}
                                            maxlength="1" />
                                        <input type="text" inputmode="numeric" pattern="[0-9]*" class="otp-input" name="otp6" value={otp6}
                                            oninput={handleOtpInput} onkeydown={handleOtpKeydown} onfocus={handleOtpFocus}
                                            maxlength="1" />
                                    </div>
                                    <p class="resend-otp-text description-color">Didn't receive the OTP? <a href="#" onclick={handleResendOtp}>Resend OTP / ओटीपी दोबारा भेजें</a></p>
                                    <div class="button-group">
                                        <button class="custom-button secondary-button" onclick={handlePrevious}>Back / पीछे जाएं</button>
                                        <button class="custom-button primary-button" onclick={handleVerifyOtp}>Continue / आगे बढ़ें</button>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </template>

                    <!-- <template if:true={isStep2}>
                        <div class="step-content">
                            <div class="step-content-inner" style={backgroundStyle}>
                                <p class="description-text description-color">Please provide your Name and Employee ID / कृपया अपना नाम और कर्मचारी आईडी बताएं</p>

                                    </div>
                                    <div class="input-group">
                                        <label for="officerEmployeeId" class="input-label">Employee ID / कर्मचारी आईडी <span class="required-field-asterisk">*</span></label>
                                        <input type="text" id="officerEmployeeId" name="officerEmployeeId" value={officerEmployeeId} oninput={handleInputChange} onkeydown={handleKeyDown} placeholder="Your Employee ID" class="custom-input" required data-field="officerEmployeeId"/>
                                    </div>
                                </div>
                                <div class="button-group">
                                    <button class="custom-button secondary-button" onclick={handlePrevious}>Back / पीछे जाएं</button>

                                </div>
                            </div>
                        </div>
                    </template> -->
                    
                    <template if:true={isStep3Report}>
                        <div class="step-content colFlex" style="background:transparent;">
                            <div class="step-content-inner">
                                <p class="description-text description-color">
                                    Enter the 'RF-' prefixed referral ID Shared when the patient was referred to you by PHWC / 
                                    'RF-' से शुरू होने वाली रेफरल आईडी दर्ज करें
                                </p>

                                <div class="search-input-group">
                                    <input type="text" name="phwcReferralIdInput" value={phwcReferralIdInput} 
                                        oninput={handleInputChange} onkeydown={handleKeyDown} 
                                        placeholder="Enter Referral ID / रेफरल आईडी दर्ज करें" class="custom-input search-input" />
                                    <button class="custom-button search-button" onclick={handleSearchReferral}>
                                        Search / खोजें
                                    </button>
                                </div>
                                <template if:true={isConsentGranted}>

                                    <template if:true={isDataVisible}>   
                                        <template if:true={isZipping}>
                                            <lightning-spinner
                                                alternative-text="Preparing ZIP..."
                                                size="medium">
                                            </lightning-spinner>
                                        </template>
                                        <div class="grid">
                                    
                                            <div class="accordion-section">
                                                <div class="accordion-header">
                                                    <h3>Patient Details / मरीज का विवरण</h3>
                                                </div>
                                                <div class="accordion-content1 gridCol2 info-display-grid">
                                                    <div class="info-item">
                                                        <label class="info-label">Full Name / पूरा नाम</label>
                                                        <span class="info-value">{patientFullName}</span>
                                                    </div>
                                                    <div class="info-item">
                                                        <label class="info-label">Age / उम्र</label>
                                                        <span class="info-value">{patientAge}</span>
                                                    </div>
                                                    <div class="info-item">
                                                        <label class="info-label">Gender / लिंग</label>
                                                        <span class="info-value">{patientGender}</span>
                                                    </div>
                                                    <div class="info-item">
                                                        <label class="info-label">Phone Number / फोन नंबर</label>
                                                        <span class="info-value">{patientPhone}</span>
                                                    </div>      
                                                </div>
                                            </div>
                                            <div class="accordion-section">
                                                <div class="accordion-header">
                                                    <h3>Patient Attendant Details / रोगी परिचारक का विवरण</h3>
                                                </div>
                                                <div class="accordion-content1 gridCol2 info-display-grid">
                                                    <div class="info-item">
                                                        <label class="info-label">Attendant Name / देखभालकर्ता का नाम</label>
                                                        <span class="info-value">{attendantName}</span>
                                                    </div>
                                                    <div class="info-item">
                                                        <label class="info-label">Relation with Patient / मरीज से संबंध</label>
                                                        <span class="info-value">{attendantRelation}</span>
                                                    </div>
                                                    <div class="info-item">
                                                        <label class="info-label">Attendant Phone / देखभालकर्ता का फोन नंबर</label>
                                                        <span class="info-value">{attendantPhone}</span>
                                                    </div>                              
                                                </div>
                                            </div>
                                        </div>
                                        <div class="grid">
                                            <div class="accordion-section">
                                                <div class="accordion-header">
                                                    <h3>Referral Context / रेफरल संदर्भ</h3>
                                                </div>


                                                <div class="accordion-content1 gridCol2 info-display-grid">
                                                    <div class="info-item">
                                                        <label class="info-label">Referred Specialty / संदर्भित विशेषज्ञता</label>
                                                        <span class="info-value">{recommendedSpeciality}</span>
                                                    </div>

                                                    <div class="info-item">
                                                        <label class="info-label">Preliminary Diagnosis / प्रारंभिक निदान</label>
                                                        <span class="info-value">{recommendedDiagnosis}</span>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="accordion-section">
                                                <div class="accordion-header">
                                                    <h3>Referred By (PHWC Doctor) / संदर्भकर्ता (PHWC डॉक्टर)</h3>
                                                </div>

                                                <div class="accordion-content1 gridCol2 info-display-grid">
                                                    <!-- <div class="info-item">
                                                        <label class="info-label">Designation / पद</label>
                                                        <span class="info-value">PHWC Medical Officer</span>
                                                    </div> -->

                                                    <div class="info-item">
                                                        <label class="info-label">Referring PHWC / संदर्भित PHWC केंद्र</label>
                                                        <span class="info-value">{phwcName}</span>
                                                    </div>
                                                    <div class="info-item">
                                                        <label class="info-label">Referring Doctor / संदर्भित डॉक्टर का नाम</label>
                                                        <span class="info-value">{drName}</span>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="reports-table-container">
                                            <div class="table-header-actions slds-grid slds-grid_align-end">
                                                <template if:true={hasAnyFiles}>
                                                    <button class="view-btn" style="margin: 10px 10px 0px 0px;" onclick={handleDownloadAll}>
                                                        Download All (ZIP) / सभी डाउनलोड करें
                                                    </button>
                                                </template>
                                            </div>
                                            <template if:true={summaryFiles.length}>
                                                <h3 class="table-title">Referral Summary / रेफरल सारांश</h3>
                                                <table class="custom-table slds-m-bottom_large">
                                                    <thead>
                                                        <tr>
                                                            <th style="text-align: left; padding-left: 35px;">Document Name / दस्तावेज़ का नाम</th>
                                                            <th style="text-align: center;">Download / डाउनलोड</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody  class="responsive-table-body">
                                                        <template for:each={summaryFiles} for:item="file">
                                                            <tr key={file.Id}>
                                                                <td>
                                                                    <div class="file-name-cell">
                                                                        <lightning-icon icon-name={file.iconName} size="small" class="slds-m-right_small"></lightning-icon>
                                                                        <span>{file.Title}</span>
                                                                    </div>
                                                                </td>
                                                                
                                                                <td style="text-align: center;">
                                                                    <button class="view-btn" data-id={file.Id} data-type={file.Type} data-name={file.Title} onclick={handleDownloadFile}>Download</button>
                                                                </td>
                                                            </tr>
                                                        </template>
                                                    </tbody>
                                                </table>
                                            </template>
                                            <template if:true={diagnosticFiles.length}>
                                                <h3 class="table-title"> Diagnostic Reports / नैदानिक रिपोर्ट</h3>
                                                <table class="custom-table">
                                                    <thead>
                                                        <tr>
                                                            <th style="text-align: left; padding-left: 35px;">Report Name / रिपोर्ट का नाम</th>
                                                            <th style="text-align: center;">Download / डाउनलोड</th>                                                        
                                                        </tr>
                                                    </thead>
                                                    <tbody class="responsive-table-body">
                                                        <template for:each={diagnosticFiles} for:item="file">
                                                            <tr key={file.Id}>
                                                                <td>
                                                                    <div class="file-name-cell">
                                                                        <lightning-icon icon-name={file.iconName} size="small" class="slds-m-right_small"></lightning-icon>
                                                                        <span>{file.Title}</span>
                                                                    </div>
                                                                </td>
                                                                <td style="text-align: center;">
                                                                    <button class="view-btn" data-id={file.Id} data-type={file.Type} data-name={file.Title} onclick={handleDownloadFile}>Download</button>
                                                                </td>
                                                            </tr>
                                                        </template>
                                                    </tbody>
                                                </table>
                                            </template>
                                        </div>
                                    </template>
                                </template>
                                <template if:false={isConsentGranted}>
                                    <div class="consent-warning-box">
                                        <h3>🔒 Patient Consent Pending / रोगी की सहमति लंबित</h3>
                                        <p>
                                            Patient consent for sharing medical details has not been granted.
                                            As per Government of India guidelines, empanelled hospitals cannot
                                            view patient information without consent.
                                        </p>
                                        <p>
                                            कृपया PHWC से संपर्क करें या रोगी की सहमति स्वीकृत होने की प्रतीक्षा करें।
                                        </p>
                                    </div>
                                </template>
                            </div>
                            <div class="button-group">
                                <button class="custom-button secondary-button" onclick={handlePrevious}>Back / पीछे जाएं</button>
                            </div>
                        </div>
                    </template>

                                    </div>
                                </template>

                                <div class="summary-section">
                                    <h4>Attachments Notes: / अटैचमेंट्स के नोट्स:</h4>
                                    <p>{notes}</p>
                                    <template if:true={uploadedAllFiles.length}>
                                        <h4>Uploaded File Names: / अपलोड की गई फाइलों के नाम:</h4>
                                        <ul>
                                            <template for:each={uploadedAllFiles} for:item="file">
                                                <li key={file.id}>{file.name}</li>
                                            </template>
                                        </ul>
                                    </template>
                                </div>

                                <div class="summary-section">
                                    <h4>Treating Physician Details: / इलाज करने वाले डॉक्टर की जानकारी:</h4>
                                    <p>{treatingPhysicianNameDesignation}</p>
                                </div>

                                <div class="summary-section">
                                    <h4>Declaration Consent: / घोषणा की सहमति:</h4>
                                    <p>{displayDeclarationConsent}</p>
                                </div>

                                <div class="button-group">
                                    <button class="custom-button secondary-button" onclick={handlePrevious}>Back / पीछे जाएं</button>
                                    <button class="custom-button primary-button" onclick={handleCompleteCareTransition}>Confirm & Complete / पुष्टि करें और पूरा करें</button>
                                </div>
                            </div>
                        </div>
                    </template>
                </template>
            </div>
        </div>
    </template>

    <template if:true={showThankYouPage}>
        <div class="pmjay-portal-container thank-you-full-page">
            <div class="step-content thank-you-page">
                <div class="step-content-inner" style={backgroundStyle}>
                    <h2 class="thank-you-title">Thank You! / धन्यवाद!</h2>
                    <p class="description-text description-color">
                        <template if:true={isPatientCareTransitionFlow}>
                            This patient's intervention details have been successfully shared with their PHWC. / इस मरीज़ के हस्तक्षेप से संबंधित विवरण सफलतापूर्वक उनके PHWC के साथ साझा कर दिए गए हैं
                        </template>
                        <template if:true={isPatientReceivedFlow}>
                            This patient's arrival has been recorded successfully. /  इस मरीज़ के हस्तक्षेप से संबंधित विवरण सफलतापूर्वक उनके PHWC के साथ साझा कर दिए गए हैं   
                            </template>
                    </p>
                    <button class="custom-button primary-button" onclick={handleReturnToLogin}>
                        Return to Patient Care Portal / रोगी देखभाल पोर्टल पर वापस जाएँ
                    </button>
                </div>
            </div>
        </div>
    </template>
</template>

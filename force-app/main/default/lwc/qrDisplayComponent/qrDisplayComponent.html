                    {kendraDetails.Street}, {kendraDetails.PostalCode}
                    <lightning-icon icon-name="utility:new_window" alternative-text="Open in Maps" title="Open in Google Maps" size="xx-small"></lightning-icon>
                </a>
            </div>
        </div>
    


                    <div class="qr-container">
